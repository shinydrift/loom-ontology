[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loom-ontology"
version = "0.0.1"
description = "Declarative ontology framework over Apache Iceberg, wired to agents via MCP"
requires-python = ">=3.11"
# The spec module — loading and validating an ontology — stays dependency-free on purpose.
# Everything that touches storage, compute, or a transport is an extra.
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# Catalog layer: pyiceberg plus the SQLite metastore driver, so a local warehouse needs no services.
iceberg = ["pyiceberg[sql-sqlite]>=0.9", "pyarrow>=15"]
# Query layer. pytz is not optional in practice — DuckDB needs it to convert a `timestamptz`
# column back to a Python datetime, which any spec with a `timestamp` property will hit.
duckdb = ["duckdb>=1.0", "pytz"]
# Agent layer. The 2.x lowlevel Server API (on_list_tools/on_call_tool) is what mcp/server.py uses.
# Deliberately still one extra for both transports: starlette and uvicorn, which `serve_http` needs,
# are hard dependencies of `mcp` itself, so serving over HTTP asks nothing more of a deployment than
# serving over stdio already did.
mcp = ["mcp>=2.0"]
# Attestation. Declared explicitly even though `mcp` happens to pull PyJWT in today: a transitive
# dependency is one an upstream may drop in a patch release, and this is the one that decides
# whether a caller can be named. `[crypto]` is not optional either — without it PyJWT can verify
# only symmetric signatures, which is exactly the algorithm class `auth.ALGORITHMS` refuses.
auth = ["pyjwt[crypto]>=2.9"]
# Embedding. fastembed rather than sentence-transformers: it runs the same class of model on
# onnxruntime instead of torch, which is the difference between a ~150MB install and a ~2GB one for
# what `provider: local` — the *default* provider — needs. httpx is what `provider: openai` posts
# with, and it is already a hard dependency of `mcp`; it is declared here anyway, because a
# transitive dependency is one an upstream may drop in a patch release.
embed = ["fastembed>=0.4", "httpx>=0.27"]
all = ["loom-ontology[iceberg,duckdb,mcp,auth,embed]"]

[project.scripts]
loom = "loom.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B"]
ignore = [
    "E501",  # long lines are usually aligned YAML/SQL fixtures; line-length above is the guard
    "B008",  # dataclass field(default_factory=...) reads as a call in a default
]
