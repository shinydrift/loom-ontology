version: 0

catalogs:
  # A real Iceberg catalog with nothing to install and nothing to run: pyiceberg's SQL catalog
  # keeps metadata in SQLite and table data on the local filesystem. Swapping this block for a
  # `type: iceberg-rest` entry is the only change needed to point the same ontology at a
  # production lake — no spec edits, no code changes.
  local:
    type: iceberg-sql
    uri: sqlite:///.warehouse/catalog.db
    warehouse: file://.warehouse

engine:
  type: duckdb

mcp:
  name: loom-retail
  transport: stdio
  # Uncomment to expose the three declared actions as `run_` tools. Off by default: declaring an
  # action and serving it to every client that connects are different decisions, and `loom serve`
  # was a read-only command for long enough that deployments were pointed at real lakes on that
  # basis. `loom run` reaches the same runtime either way.
  #
  # `actor` is what a served run is recorded as in `_loom_meta.edits`. Declared by you, never
  # inferred by Loom — neither transport has an authenticated caller to name, and a log that says
  # `unknown` beats one that confidently names whoever started the process.
  # writes: true
  # actor: agent:support-bot
  #
  # Switch `transport` to `http` to serve the same tools over a socket instead of a pipe. The
  # address lives here rather than on the command line, for the reason `writes` does: a flag lets
  # one invocation contradict the file you review. `host` defaults to 127.0.0.1 on purpose — and
  # `writes: true` refuses to start on anything else, because `actor` above names a deployment
  # rather than a caller, which is only honest while the callers are the people who could already
  # run this binary.
  # transport: http
  # host: 127.0.0.1
  # port: 8000
  # path: /mcp

# What this deployment withholds. Uncomment and `loom query`, `loom run` and every generated tool
# stop returning `ltv` — enforced in the resolver's projection, so the column is not in the SQL
# rather than dropped from the rows on the way back.
#
# A policy names no caller, and that is deliberate: `loom query` has no transport, so nothing can
# ever attest an identity to it, and governance that only existed over an authenticated socket would
# leave the direct half of "a direct call and an agent call filter identically" ungovernable. So
# policies are per *deployment* — run one per audience — and `when:` is reserved for the day a
# caller can be attested, refused until then rather than approximated.
#
# Try masking `tier` instead and the server refuses to start: `upgradeTier` writes it, and a
# deployment cannot both withhold a property and change it. See docs/spec-v0.md §6.1.
#
# `rows:` is the other half — the same expression language a validation rule is written in, but
# over the row rather than over a call. A filtered row is simply *absent*: `get_` answers
# `found: false` in the same words it uses for a key that never existed, because the rows are the
# data and "you may not see this one" would be an oracle over it. It is compiled into the query on
# the read path and evaluated in process on the write path, so an agent cannot act on a row it
# cannot see.
#
# `edit_log:` is a posture rather than a policy, which is why it sits beside `policies:` and not in
# it: it names no objectType, because a *catalog* either can hold `_loom_meta.edits` or cannot. Set
# it to `required` and a deployment that cannot record what it writes refuses to start — the log
# table is created up front, so a permissions problem is a startup error instead of a `log_failed`
# discovered after the row landed. It deliberately promises nothing about an individual run: there
# is no transaction spanning a row's table and the log, so an append that fails *after* the commit
# still reports `log_failed`, and the run's `edit_id` is in the Iceberg snapshot summary either way.
# governance:
#   edit_log: required
#   policies:
#     - name: hide-ltv
#       objectType: Customer
#       mask: [ltv]
#     - name: current-customers-only
#       objectType: Customer
#       rows: "object.tier != 'closed'"
