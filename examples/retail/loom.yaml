version: 0

catalogs:
  # A real Iceberg catalog with nothing to install and nothing to run: pyiceberg's SQL catalog
  # keeps metadata in SQLite and table data on the local filesystem. Swapping this block for a
  # `type: iceberg-rest` entry is the only change needed to point the same ontology at a
  # production lake — no spec edits, no code changes.
  local:
    type: iceberg-sql
    uri: sqlite:///.warehouse/catalog.db
    warehouse: file://.warehouse

engine:
  type: duckdb

mcp:
  name: loom-retail
  transport: stdio
  # Uncomment to expose the three declared actions as `run_` tools. Off by default: declaring an
  # action and serving it to every client that connects are different decisions, and `loom serve`
  # was a read-only command for long enough that deployments were pointed at real lakes on that
  # basis. `loom run` reaches the same runtime either way.
  #
  # `actor` is what a served run is recorded as in `_loom_meta.edits`. Declared by you, never
  # inferred by Loom — neither transport has an authenticated caller to name, and a log that says
  # `unknown` beats one that confidently names whoever started the process.
  # writes: true
  # actor: agent:support-bot
  #
  # Switch `transport` to `http` to serve the same tools over a socket instead of a pipe. The
  # address lives here rather than on the command line, for the reason `writes` does: a flag lets
  # one invocation contradict the file you review. `host` defaults to 127.0.0.1 on purpose — and
  # `writes: true` refuses to start on anything else, because `actor` above names a deployment
  # rather than a caller, which is only honest while the callers are the people who could already
  # run this binary.
  # transport: http
  # host: 127.0.0.1
  # port: 8000
  # path: /mcp
