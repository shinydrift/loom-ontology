action:
  apiName: forgetCustomer
  displayName: Forget customer
  description: Erase a customer record on request
  targetObjectType: Customer
  operation: delete
  parameters:
    - { name: customer, type: objectRef, objectType: Customer }
  effects:
    - deleteObject:
        key: "{{ customer }}"
# `operation: delete` is not in tension with "Loom never drops". Never-drop is about *inference* —
# Loom refusing to read a destruction into the silence of a spec, because a column no property
# mentions is someone else's data. This is the opposite of silence, and it is one row rather than
# a column or a table. Loom still never drops either of those.
