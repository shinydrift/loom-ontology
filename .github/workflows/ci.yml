name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The extras are installed deliberately: the end-to-end test skips itself without them, so a
      # green run that omitted them would cover far less than it appears to.
      - name: Install
        run: pip install -e ".[dev,iceberg,duckdb,mcp]"
      - name: Lint
        run: ruff check src tests examples
      - name: Test
        run: pytest -q
      - name: Smoke-test the CLI
        run: loom validate tests/fixtures/valid

  example:
    name: End-to-end example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev,iceberg,duckdb,mcp]"
      # Runs the documented quickstart exactly as a reader would: seed a local Iceberg warehouse,
      # check the spec against its real metadata, then read through the resolver and DuckDB. If the
      # README's commands stop working, this job fails.
      # Before anything exists, so the plan is the whole warehouse as creations — the one state
      # `validate --physical` can't be run against at all.
      - name: Plan against an empty warehouse
        run: |
          mkdir -p examples/retail/.warehouse  # the local SQL catalog keeps its metastore in here
          loom plan examples/retail/ontology
      - name: Seed the local warehouse
        run: python examples/retail/seed.py
      - name: Re-plan — a seeded warehouse matches the spec, so this must be a no-op
        run: loom plan examples/retail/ontology | grep -q 'No changes'
      - name: Validate against the live catalog
        run: loom validate --physical examples/retail/ontology
      - name: Read one object
        run: loom query Customer examples/retail/ontology --key c1
      - name: Traverse a link
        run: loom query Customer examples/retail/ontology --key c2 --link orders
